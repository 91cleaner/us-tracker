name: Collect opinions (SEC 8-K / IR)
on:
  schedule: [{cron: '50 22 * * 1-5'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 collector/opinions/fetch_exec.py || echo "fetch_exec failed; keeping previous files"
      - run: python3 collector/opinions/build.py
      - run: |
          git config user.name "us-tracker-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opinions
          git diff --cached --quiet && exit 0
          git commit -m "data: opinions $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
